name: NuGet managed preview release

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: Type exactly "NemotronDiarizationSharp 0.1.0-preview.1" to publish.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate-managed-preview:
    name: Build and validate managed preview package
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the main branch and selected commit
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "This workflow validates main only; received ref '$env:GITHUB_REF'."
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checked-out HEAD '$head' does not match workflow commit '$env:GITHUB_SHA'."
          }

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Show selected SDK
        run: dotnet --version

      - name: Restore managed SDK
        run: dotnet restore src/NemotronDiarizationSharp/NemotronDiarizationSharp.csproj --verbosity minimal

      - name: Pack managed SDK and symbols
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'nemotron-managed-preview'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          dotnet pack src/NemotronDiarizationSharp/NemotronDiarizationSharp.csproj `
            --configuration Release `
            --no-restore `
            --output $output `
            -p:IncludeSymbols=true `
            -p:SymbolPackageFormat=snupkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package metadata, Source Link, and managed-only contents
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./eng/Validate-NuGetPreview.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'nemotron-managed-preview')

  publish-managed-preview:
    name: Publish managed preview to NuGet.org
    needs: validate-managed-preview
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_confirmation == 'NemotronDiarizationSharp 0.1.0-preview.1' && needs.validate-managed-preview.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the main branch and selected commit
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Publishing is allowed from main only; received ref '$env:GITHUB_REF'."
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checked-out HEAD '$head' does not match workflow commit '$env:GITHUB_SHA'."
          }

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore managed SDK
        run: dotnet restore src/NemotronDiarizationSharp/NemotronDiarizationSharp.csproj --verbosity minimal

      - name: Rebuild managed package and symbols
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'nemotron-managed-preview'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          dotnet pack src/NemotronDiarizationSharp/NemotronDiarizationSharp.csproj `
            --configuration Release `
            --no-restore `
            --output $output `
            -p:IncludeSymbols=true `
            -p:SymbolPackageFormat=snupkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Revalidate exact package immediately before publishing
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: ./eng/Validate-NuGetPreview.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'nemotron-managed-preview')

      - name: Exchange GitHub OIDC identity for a short-lived NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: Gargulz
          source: https://api.nuget.org/v3/index.json

      - name: Push managed package and matching symbols package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'nemotron-managed-preview/NemotronDiarizationSharp.0.1.0-preview.1.nupkg'
          dotnet nuget push $package `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
